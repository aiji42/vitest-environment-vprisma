name: Release
on:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Must match the environment configured for the trusted publisher on npmjs.com.
    environment: npm
    permissions:
      contents: write # create tags and GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      # Trusted publishing and `npm stage publish` need npm >= 11.15 (Node 22 bundles npm 10).
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # One-off: remove the tag and notes left by failed attempts at 1.0.0-beta.1, which was never
      # published. Remove this step once 1.0.0-beta.1 is released.
      - name: Clean up refs from failed 1.0.0-beta.1 attempts
        run: |
          for ref in refs/tags/vitest-prisma@1.0.0-beta.1 refs/notes/semantic-release-vitest-prisma@1.0.0-beta.1; do
            if git ls-remote --exit-code origin "$ref" > /dev/null; then git push origin ":$ref"; fi
            git update-ref -d "$ref" || true
          done
      # No NPM_TOKEN: the trusted publisher on npmjs.com authorizes `npm stage publish` only.
      # The staged version goes live after a maintainer approves it on npmjs.com (Staged Packages).
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
